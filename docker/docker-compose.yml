# =============================================================================
# Docker Compose for astro-koharu
# =============================================================================
# Usage:
#   1. Copy ../.env.example to ../.env and fill in your values
#   2. Start YukiBloom-backend's compose stack first so the shared API network exists:
#        docker compose --env-file ../YukiBloom-backend/.env -f ../YukiBloom-backend/compose.yaml up -d --build
#   3. Run (from repo root):
#        docker compose --env-file ./.env -f docker/docker-compose.yml up -d --build
#   4. Access: http://localhost:4321 (or http://localhost:${BLOG_PORT} if customized)
#
# To update after config changes:
#   docker compose --env-file ./.env -f docker/docker-compose.yml up -d --build
# =============================================================================

services:
  astro-koharu:
    image: astro-koharu:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL_DOCKER:-http://api:8080}
      HOST: 0.0.0.0
      PORT: 4321
    expose:
      - "4321"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - astro-koharu-network

  nginx:
    image: astro-koharu-nginx:latest
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${BLOG_PORT:-4321}:80"
    depends_on:
      astro-koharu:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - astro-koharu-network

networks:
  astro-koharu-network:
    external: true
    name: yukibloom-public
